# Deliberately outside the root `[workspace]` (`members = ["engine", "tui"]`, an explicit list
# with no globs). This empty table stops Cargo from also walking up to that root workspace and
# erroring that this package "believes it's in a workspace when it's not" — it makes
# `engine/fuzz` its own single-member workspace with its own `Cargo.lock`, so
# `cargo build --workspace` / `cargo test --workspace` run from the repo root never touch it.
[workspace]

[package]
name = "orchestrail-engine-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"

[dependencies.orchestrail-engine]
path = ".."

[[bin]]
name = "claude_parse_transcript"
path = "fuzz_targets/claude_parse_transcript.rs"
test = false
doc = false
bench = false

[[bin]]
name = "contract_parse_outcome"
path = "fuzz_targets/contract_parse_outcome.rs"
test = false
doc = false
bench = false

[[bin]]
