name: Release

on:
  push:
    tags:
      - 'v*'

# A release is independent from CI and fuzz runs, and duplicate delivery of the
# same tag must not publish competing releases.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build-release:
    name: build release (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            extension: ''
          - os: windows-latest
            platform: windows
            extension: '.exe'
          - os: macos-latest
            platform: macos
            extension: ''
    steps:
      # Actions are pinned to a full commit SHA (supply-chain hardening); the
      # trailing comment records the human-readable version for Dependabot.
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master (2026-07-16)
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Build release binaries
        run: cargo build --release --bin orchestrail-engine --bin orchestrail-tui

      - name: Name binaries and generate checksums
        shell: pwsh
        run: |
          $arch = switch ($env:RUNNER_ARCH) {
            'X64' { 'x86_64' }
            'ARM64' { 'aarch64' }
            default { throw "Unsupported runner architecture: $env:RUNNER_ARCH" }
          }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          foreach ($binary in @('engine', 'tui')) {
            $source = "target/release/orchestrail-$binary${{ matrix.extension }}"
            $asset = "orchestrail-$binary-${{ matrix.platform }}-$arch${{ matrix.extension }}"
            $destination = Join-Path dist $asset
            Copy-Item -LiteralPath $source -Destination $destination
            $hash = (Get-FileHash -LiteralPath $destination -Algorithm SHA256).Hash.ToLowerInvariant()
            Set-Content -LiteralPath "$destination.sha256" -Encoding ascii -Value "$hash  $asset"
          }

      - name: Upload release binaries
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: binaries-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error

  generate-changelog:
    name: generate changelog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Generate release notes
        uses: orhun/git-cliff-action@f50e11560dce63f7c33227798f90b924471a88b5 # v4.8.0
        with:
          config: cliff.toml
          args: --current --tag ${{ github.ref_name }} --strip header --verbose
        env:
          OUTPUT: release-notes.md

      - name: Upload release notes
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error

  create-release:
    name: create GitHub release
    needs: [build-release, generate-changelog]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release binaries
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: binaries-*
          path: dist
          merge-multiple: true

      - name: Download release notes
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-notes

      - name: Publish GitHub release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ github.ref_name }}
          name: Orchestrail ${{ github.ref_name }}
          body_path: release-notes.md
          files: dist/*
          fail_on_unmatched_files: true
